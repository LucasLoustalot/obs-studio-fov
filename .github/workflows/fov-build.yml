name: Build OBS-FOV

on:
  push:
    branches-ignore:
      - "ga-ignore-*"

jobs:
  check_program_compilation_linux:
    name: FOV - Build on Linux
    runs-on: [ self-hosted, linux, x64, ubuntu ]

    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: ./.github/scripts/FOV/build_linux.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v5
        with:
          name: obs-fov-linux
          path: build/rundir/

  check_program_compilation_windows:
    name: FOV - Build on Windows
    runs-on: [ self-hosted, windows, x64 ]

    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: ./.github/scripts/FOV/build_windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: obs-fov-windows
          path: build_x64/rundir

  check_program_compilation_macos:
    name: FOV - Build on macOS
    runs-on: macos-latest

    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: ./.github/scripts/FOV/build_macos.sh
